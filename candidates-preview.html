<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Candidates — VotePulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--jr:#A31621;--jrd:#6B1414;--gold:#C8922A;--navy:#0D1B2A;--surface:#F5F5F0;--on-p:#F5E8C8;--muted:#EAEAE2;--mf:#4A5663;--border:#D9D9CF}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased}
body{font-family:'Archivo',system-ui,sans-serif;background:var(--surface);color:var(--navy)}
a{color:inherit;text-decoration:none}
::selection{background:var(--jr);color:var(--on-p)}

.ribbon{height:3px;background:var(--jr)}
.header{position:sticky;top:0;z-index:40;border-bottom:1px solid var(--border);background:rgba(245,245,240,.95);backdrop-filter:blur(6px)}
.header-inner{max-width:1152px;margin:0 auto;display:flex;height:56px;align-items:center;justify-content:space-between;padding:0 20px}
.logo{display:flex;align-items:center;gap:10px}.logo svg{height:28px;width:28px}.logo span{font-size:15px;font-weight:700}
.nav{display:flex;gap:4px}.nav a{padding:6px 12px;border-radius:6px;font-size:13px;font-weight:500;color:var(--mf);transition:.15s}.nav a:hover{background:rgba(13,27,42,.05);color:var(--navy)}.nav a.active{color:var(--navy);background:rgba(13,27,42,.05)}

.page{max-width:1152px;margin:0 auto;padding:40px 20px 64px}
.page h1{font-size:34px;font-weight:700;letter-spacing:-.02em}
.page>p{margin-top:8px;max-width:480px;font-size:14px;color:var(--mf)}

.filters{margin-top:32px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.search{position:relative;flex:1;min-width:200px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:rgba(74,86,99,.5)}
.search input{width:100%;height:40px;border:1px solid var(--border);border-radius:6px;background:#fff;padding:0 12px 0 36px;font-size:13px;color:var(--navy);outline:none;transition:.15s}
.search input:focus{border-color:rgba(163,22,33,.4);box-shadow:0 0 0 2px rgba(163,22,33,.1)}
.search input::placeholder{color:rgba(74,86,99,.5)}
select{height:40px;border:1px solid var(--border);border-radius:6px;background:#fff;padding:0 12px;font-size:13px;color:var(--navy);outline:none;transition:.15s;cursor:pointer;font-family:inherit}
select:focus{border-color:rgba(163,22,33,.4);box-shadow:0 0 0 2px rgba(163,22,33,.1)}
.clear-btn{height:40px;padding:0 12px;border:1px solid var(--border);border-radius:6px;background:#fff;font-size:12px;font-weight:500;color:var(--mf);cursor:pointer;font-family:inherit;transition:.15s;display:none}
.clear-btn:hover{border-color:rgba(163,22,33,.3);color:var(--jr)}
.clear-btn.show{display:block}

.count{margin-top:16px;font-size:12px;font-weight:500;color:var(--mf)}

.grid{margin-top:16px;display:grid;gap:12px}
@media(min-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1024px){.grid{grid-template-columns:repeat(3,1fr)}}

.card{display:flex;gap:16px;padding:16px;border:1px solid var(--border);border-radius:14px;background:#fff;transition:all .2s;cursor:pointer}
.card:hover{box-shadow:0 2px 4px rgba(13,27,42,.08),0 12px 24px rgba(13,27,42,.08)}
.avatar{width:48px;height:48px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--jr);color:var(--on-p);font-size:14px;font-weight:700;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.card-body{min-width:0;flex:1}
.card-name{font-size:15px;font-weight:600;color:var(--navy);transition:.15s}
.card:hover .card-name{color:var(--jr)}
.card-meta{margin-top:4px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12px;color:var(--mf)}
.card-meta .sep{color:var(--border)}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;border:1px solid var(--border);background:rgba(234,234,226,.5);font-size:11px;font-weight:500;color:var(--mf)}
.badge.ind{border-color:rgba(200,146,42,.3);background:rgba(200,146,42,.1);color:var(--gold)}
.card-summary{margin-top:8px;font-size:12px;line-height:1.55;color:var(--mf)}
.card-summary .more{font-weight:500;color:var(--gold);transition:.15s}
.card:hover .card-summary .more{color:var(--jr)}
.card-summary .pending{font-style:italic;color:rgba(74,86,99,.5)}

.empty{margin-top:48px;display:none;flex-direction:column;align-items:center;text-align:center;padding:64px 20px}
.empty.show{display:flex}
.empty-icon{width:56px;height:56px;border-radius:999px;background:var(--muted);display:flex;align-items:center;justify-content:center}
.empty-icon svg{width:24px;height:24px;color:rgba(74,86,99,.4)}
.empty h3{margin-top:16px;font-size:15px;font-weight:600}
.empty p{margin-top:4px;font-size:13px;color:var(--mf)}
</style>
</head>
<body>
<div class="ribbon"></div>
<header class="header"><div class="header-inner">
  <a href="preview.html" class="logo"><svg viewBox="0 0 28 28"><rect width="28" height="28" rx="6" fill="#A31621"/><path d="M7 18.5V9h2.3l2.7 4.6L14.7 9H17v9.5h-1.9v-5.5l-2.5 4.3h-1.2L8.9 13v5.5Z M19 18.5V9h1.9v9.5Z" fill="#F5E8C8"/><circle cx="22.5" cy="9.5" r="1.1" fill="#C8922A"/></svg><span>VotePulse</span></a>
  <nav class="nav"><a href="preview.html">Home</a><a href="#" class="active">Candidates</a><a href="#">Compare</a><a href="#">About</a></nav>
</div></header>

<main class="page">
  <h1>Candidates</h1>
  <p>Browse every candidate standing across Jersey's parishes. Filter by district, party, or search by name.</p>

  <div class="filters">
    <div class="search">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="9" r="6"/><path d="M13.5 13.5 18 18"/></svg>
      <input type="text" id="search" placeholder="Search by name…"/>
    </div>
    <select id="district"><option value="">All districts</option></select>
    <select id="party"><option value="">All parties</option><option value="__independent">Independent</option></select>
    <button class="clear-btn" id="clearBtn">Clear</button>
  </div>

  <p class="count" id="count"></p>

  <div class="grid" id="grid"></div>

  <div class="empty" id="empty">
    <div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M16 16 21 21"/><path d="M8 11h6"/></svg></div>
    <h3>No candidates found</h3>
    <p>Try adjusting your filters or search term.</p>
  </div>
</main>

<script>
const CANDIDATES = [
  {slug:"john-smith",name:"John Smith",district:"St Helier Central",party:"Reform Jersey",photoUrl:null,aiSummary:"Focused on affordable housing policy and reducing Jersey's cost of living for working families. Proposes rent controls and a public housing construction programme to build 500 new units by 2030."},
  {slug:"marie-le-breton",name:"Marie Le Breton",district:"St Brelade",party:null,photoUrl:null,aiSummary:"Climate-first independent candidate proposing Jersey reaches net zero by 2040. Advocates for offshore wind investment, electric bus fleet, and coastal protection funding."},
  {slug:"david-pallot",name:"David Pallot",district:"Trinity",party:"Jersey Alliance",photoUrl:null,aiSummary:null},
  {slug:"sarah-nicolle",name:"Sarah Nicolle",district:"St Saviour",party:"Reform Jersey",photoUrl:null,aiSummary:"Education-focused candidate calling for higher teacher pay, smaller class sizes, and free school meals for all primary school children."},
  {slug:"peter-le-maistre",name:"Peter Le Maistre",district:"St Peter",party:null,photoUrl:null,aiSummary:"Independent farmer and parish Constable candidate. Priorities include protecting agricultural land from development and supporting local food production."},
  {slug:"rachel-vibert",name:"Rachel Vibert",district:"Grouville",party:"Jersey Alliance",photoUrl:null,aiSummary:"Former nurse advocating for General Hospital modernisation, reduced GP waiting times, and expanded mental health services across the Island."},
  {slug:"tom-binet",name:"Tom Binet",district:"St Helier North",party:"Reform Jersey",photoUrl:null,aiSummary:null},
  {slug:"anna-sherrington",name:"Anna Sherrington",district:"St Clement",party:null,photoUrl:null,aiSummary:"Retired teacher and community advocate. Running on digital government reform and improved public service accessibility for elderly residents."},
  {slug:"mark-le-cornu",name:"Mark Le Cornu",district:"St Lawrence",party:"Jersey Alliance",photoUrl:null,aiSummary:"Economist proposing a review of Jersey's tax framework including a progressive income tax model and reduced GST on essential goods."},
];

const districtSelect = document.getElementById('district');
const partySelect = document.getElementById('party');
const searchInput = document.getElementById('search');
const clearBtn = document.getElementById('clearBtn');
const grid = document.getElementById('grid');
const countEl = document.getElementById('count');
const emptyEl = document.getElementById('empty');

// Populate filter options
const districts = [...new Set(CANDIDATES.map(c=>c.district))].sort();
const parties = [...new Set(CANDIDATES.map(c=>c.party).filter(Boolean))].sort();
districts.forEach(d=>{const o=document.createElement('option');o.value=d;o.textContent=d;districtSelect.appendChild(o)});
parties.forEach(p=>{const o=document.createElement('option');o.value=p;o.textContent=p;partySelect.appendChild(o)});

function initials(name){return name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase()}
function truncate(s,n){if(s.length<=n)return s;return s.slice(0,n).replace(/\s+\S*$/,'')+'…'}

function render(){
  const q=searchInput.value.toLowerCase().trim();
  const d=districtSelect.value;
  const p=partySelect.value;
  const hasFilter=q||d||p;
  clearBtn.classList.toggle('show',!!hasFilter);

  const filtered=CANDIDATES.filter(c=>{
    if(q&&!c.name.toLowerCase().includes(q))return false;
    if(d&&c.district!==d)return false;
    if(p==='__independent'&&c.party!==null)return false;
    if(p&&p!=='__independent'&&c.party!==p)return false;
    return true;
  });

  countEl.textContent=`${filtered.length} candidate${filtered.length!==1?'s':''}${hasFilter?' matching filters':''}`;

  if(filtered.length===0){
    grid.style.display='none';
    emptyEl.classList.add('show');
    return;
  }
  emptyEl.classList.remove('show');
  grid.style.display='';

  grid.innerHTML=filtered.map(c=>{
    const badge=c.party
      ?`<span class="badge">${c.party}</span>`
      :`<span class="badge ind">Independent</span>`;
    const summary=c.aiSummary
      ?`<span>${truncate(c.aiSummary,120)} <span class="more">Read more\u2009→</span></span>`
      :`<span class="pending">Summary coming soon</span>`;
    return `<a href="#" class="card">
      <div class="avatar">${c.photoUrl?`<img src="${c.photoUrl}" alt="">`:`${initials(c.name)}`}</div>
      <div class="card-body">
        <p class="card-name">${c.name}</p>
        <div class="card-meta"><span>${c.district}</span><span class="sep">·</span>${badge}</div>
        <p class="card-summary">${summary}</p>
      </div>
    </a>`;
  }).join('');
}

searchInput.addEventListener('input',render);
districtSelect.addEventListener('change',render);
partySelect.addEventListener('change',render);
clearBtn.addEventListener('click',()=>{searchInput.value='';districtSelect.value='';partySelect.value='';render()});
render();
</script>
</body>
</html>
